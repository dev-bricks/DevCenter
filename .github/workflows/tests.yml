name: DevCenter CI & Smoke Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

  test:
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q main.py manage_translations.py translator.py src tests

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra -v

  linux-platform-smoke:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system Qt libs (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q main.py manage_translations.py translator.py src tests

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra -v

      - name: Run Linux platform smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/linux_platform_smoke.py

  macos-platform-smoke:
    needs: [lint]
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q main.py manage_translations.py translator.py src tests

      - name: Run unit tests
        run: python -m pytest -ra -v

      - name: Run macOS platform smoke
        run: python tests/macos_platform_smoke.py
